[package]
name = "writ-lsp"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "writ-lsp"
path = "src/main.rs"

[lib]
name = "writ_lsp"
path = "src/lib.rs"

[dependencies]
tower-lsp = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "time", "sync"] }
dashmap = "6"
lsp-types = "0.94"
url = "2"
serde_json = "1"
writ-compiler = { path = "../writ-compiler" }
writ-diagnostics = { path = "../writ-diagnostics" }
writ-parser = { path = "../writ-parser" }
writ-module = { path = "../writ-module" }
writ-runtime = { path = "../writ-runtime" }
chumsky = { version = "0.12.0", features = ["pratt"] }
